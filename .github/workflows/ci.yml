name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        # The x402 signer unit tests. They cover the EIP-712 domain, the USDC
        # constants and the payload shape the facilitator accepts, which is the part
        # of this package that cannot be checked by hand-testing a chat call.
        run: bun test
