name: Publish to npm

# Tag-driven, matching ts-sdk / ducat / python-sdk: `git tag v2.0.0 && git push origin v2.0.0`.
#
# This repo previously had no workflow at all, so releases were manual `npm publish`
# runs from a laptop. That is how 1.1.0 came to be a different program from the source
# it was supposed to be built from: nothing tied the published tarball to a commit.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance (OIDC), which attests that this tarball was built
      # from this commit in this workflow — the property that was missing when the
      # published package and the repository diverged.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm install

      - name: Verify before publishing
        # A published version number can never be reused, and a bad publish cannot be
        # unpublished after 72 hours. Checked here rather than trusting that CI passed
        # on some earlier commit.
        run: |
          npm run build
          bun test

      - name: Check the tag matches package.json
        # A tag of v2.0.0 against a package.json still saying 1.1.0 either republishes
        # 1.1.0 (rejected) or ships the wrong version under the right tag.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Check server.json agrees too
        # server.json carries its own version and is what the MCP Registry reads.
        # Drifting from package.json means the registry advertises a version npm does
        # not serve. It has two copies of the number, so both are checked.
        run: |
          TAG="${GITHUB_REF_NAME#v}" node -e '
            const d = JSON.parse(require("fs").readFileSync("server.json", "utf8"));
            const tag = process.env.TAG;
            const found = { ".version": d.version };
            const npmPkg = (d.packages || []).find(p => p.identifier === "jarvisclaw-mcp");
            if (!npmPkg) {
              console.error("::error::server.json has no npm package entry for jarvisclaw-mcp");
              process.exit(1);
            }
            found[".packages[jarvisclaw-mcp].version"] = npmPkg.version;
            let bad = false;
            for (const [where, got] of Object.entries(found)) {
              if (got !== tag) {
                console.error(`::error::server.json ${where} is ${got}, expected ${tag}`);
                bad = true;
              }
            }
            if (bad) process.exit(1);
            console.log(`server.json agrees on ${tag}`);
          '

      - name: Check the npm credential is AUTHORIZED, not merely present
        # Asking the registry, not just testing the secret is non-empty.
        #
        # Measured on the sibling ducat repo, which uses the same secret name: an
        # unauthorized write to an EXISTING package answers
        #   404 Not Found - PUT https://registry.npmjs.org/<name>
        # not 401 — so a revoked credential reads as "package missing". `npm whoami`
        # is the cheapest authenticated call and prints only the account name.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPMSECRET repository secret is empty or unset — set it with: gh secret set NPMSECRET --repo api-jarvisclaw/jarvisclaw-mcp"
            exit 1
          fi
          echo "npm credential present (${#NODE_AUTH_TOKEN} chars) — now asking the registry"
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::NPMSECRET is present but the registry rejects it: $WHO"
            echo "::error::Publishing would fail as a misleading 404 on PUT. Replace the token:"
            echo "::error::  gh secret set NPMSECRET --repo api-jarvisclaw/jarvisclaw-mcp"
            exit 1
          fi
          echo "authorized as: $WHO"

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
